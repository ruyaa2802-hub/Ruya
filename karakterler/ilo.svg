<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="wobble">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a2a22" stroke-width="1.1" opacity="0.55"/>
    </pattern>
    <pattern id="cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a2a22" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="0" x2="7" y2="0" stroke="#3a2a22" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#3a2a22" opacity="0.45"/>
    </pattern>
    <!-- çuval bezi dokusu -->
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 2 H8 M0 6 H8" stroke="#8a7a5c" stroke-width="0.8" opacity="0.5"/>
      <path d="M2 0 V8 M6 0 V8" stroke="#8a7a5c" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <clipPath id="tunicClip"><path d="M398 570 C384 600 374 650 378 700 C380 740 388 770 396 830 L446 834 C448 810 450 795 450 790 C450 795 452 810 454 834 L504 830 C512 770 520 740 522 700 C526 650 516 600 502 570 C480 556 420 556 398 570 Z"/></clipPath>
    <clipPath id="faceClip"><ellipse cx="450" cy="466" rx="100" ry="98"/></clipPath>
  </defs>

  <!-- arka plan -->
  <rect width="900" height="1200" fill="#ece2cb"/>
  <rect width="900" height="1200" fill="url(#dots)" opacity="0.25"/>
  <path d="M0 960 C200 930 350 985 520 950 C680 920 800 960 900 945 L900 1200 L0 1200 Z" fill="#d9b9ad"/>
  <circle cx="140" cy="170" r="46" fill="#e9d6a8" stroke="#3a2a22" stroke-width="2"/>
  <circle cx="190" cy="120" r="18" fill="#e9d6a8" stroke="#3a2a22" stroke-width="2"/>

  <g filter="url(#wobble)" stroke="#2b1e18" stroke-linejoin="round" stroke-linecap="round">

    <!-- DEV VELUN PARMAĞI (ölçek için: Ilo'nun tüm vücudundan geniş) -->
    <path d="M770 -60 C730 300 690 600 662 860 C652 940 730 990 840 986 C940 982 1010 950 1030 900 C1070 700 1130 400 1210 -60 Z" fill="#8e6aa8" stroke-width="4"/>
    <path d="M940 -60 C920 300 900 640 880 986 C940 982 1010 950 1030 900 C1070 700 1130 400 1210 -60 Z" fill="url(#hatch)" stroke="none"/>
    <!-- boğum kırışıkları -->
    <path d="M722 380 C800 410 900 416 1000 400 M716 420 C800 452 900 458 996 444 M710 462 C790 490 880 496 970 486" fill="none" stroke-width="2.4"/>
    <!-- dev tırnak -->
    <path d="M700 850 C696 760 762 716 852 724 C940 734 984 796 972 878 C958 950 708 958 700 850 Z" fill="#b89ccb" stroke-width="3.5"/>
    <path d="M730 830 C736 780 780 754 836 756" fill="none" stroke="#efe4f5" stroke-width="5"/>
    <!-- tırnaktan dökülen altın toz -->
    <g fill="#e2b33a" stroke="none">
      <circle cx="690" cy="900" r="3"/><circle cx="676" cy="922" r="2"/><circle cx="700" cy="940" r="2.5"/><circle cx="668" cy="950" r="1.6"/><circle cx="712" cy="962" r="2"/>
    </g>

    <!-- MİNİK BEBEK ILO (3-4 yaş oranları: büyük kafa, tombul kısa uzuvlar) -->

    <!-- tombul bacaklar -->
    <path d="M400 820 C396 870 398 910 404 950 L444 950 C448 910 450 870 448 820 Z" fill="#ecccab" stroke-width="2.8"/>
    <path d="M452 820 C450 870 452 910 456 950 L496 950 C502 910 504 870 500 820 Z" fill="#ecccab" stroke-width="2.8"/>
    <path d="M408 892 C416 898 432 898 440 892 M460 892 C468 898 484 898 492 892" fill="none" stroke-width="1.8"/>
    <!-- minik yuvarlak ayaklar -->
    <path d="M404 946 C392 950 384 962 390 970 C406 976 436 974 446 964 L444 946 Z" fill="#ecccab" stroke-width="2.8"/>
    <path d="M496 946 C508 950 516 962 510 970 C494 976 464 974 454 964 L456 946 Z" fill="#ecccab" stroke-width="2.8"/>

    <!-- vücuda oturan tulum -->
    <path d="M398 570 C384 600 374 650 378 700 C380 740 388 770 396 830 L446 834 C448 810 450 795 450 790 C450 795 452 810 454 834 L504 830 C512 770 520 740 522 700 C526 650 516 600 502 570 C480 556 420 556 398 570 Z" fill="#e6dcc2" stroke-width="3"/>
    <g clip-path="url(#tunicClip)">
      <rect x="360" y="540" width="180" height="310" fill="url(#weave)" stroke="none"/>
      <path d="M470 556 C500 620 512 720 506 840 L560 840 L560 540 Z" fill="url(#hatch)" stroke="none"/>
    </g>
    <path d="M425 566 C438 580 462 580 475 566" fill="none" stroke-width="2.2"/>
    <path d="M396 826 C410 834 432 836 446 832 M454 832 C468 836 490 834 504 826" fill="none" stroke-width="2.2"/>
    <path d="M450 586 L450 790" fill="none" stroke-width="1.4" stroke-dasharray="3 5"/>
    <g fill="#9a7a48" stroke-width="1.4">
      <circle cx="450" cy="604" r="4.5"/><circle cx="450" cy="636" r="4.5"/><circle cx="450" cy="668" r="4.5"/>
    </g>

    <!-- tombul kollar -->
    <path d="M400 585 C380 620 370 670 372 710 C374 736 402 736 402 712 C402 676 410 630 420 600 Z" fill="#ecccab" stroke-width="2.8"/>
    <circle cx="387" cy="724" r="16" fill="#ecccab" stroke-width="2.6"/>
    <!-- sağ kol: dev parmağa uzanıyor -->
    <path d="M498 590 C540 580 580 565 616 540 C632 530 624 510 608 518 C574 538 540 552 500 560 Z" fill="#ecccab" stroke-width="2.8"/>
    <circle cx="626" cy="524" r="17" fill="#ecccab" stroke-width="2.6"/>
    <path d="M636 512 l10 -10 M641 520 l13 -4 M640 530 l12 4" fill="none" stroke-width="2.6"/>
    <!-- dar, kısa kollar -->
    <path d="M398 570 C384 584 378 604 384 620 C400 624 414 616 420 602 Z" fill="#e6dcc2" stroke-width="2.5"/>
    <path d="M502 570 C518 578 528 590 524 606 C510 612 498 606 492 594 Z" fill="#e6dcc2" stroke-width="2.5"/>

    <!-- kısa boyun -->
    <path d="M434 548 L466 548 L466 570 L434 570 Z" fill="#e6c3a0" stroke-width="2.5"/>

    <!-- KOCAMAN, SAÇSIZ YUVARLAK KAFA -->
    <ellipse cx="352" cy="484" rx="14" ry="20" fill="#ecccab" stroke-width="2.6"/>
    <ellipse cx="548" cy="484" rx="14" ry="20" fill="#ecccab" stroke-width="2.6"/>
    <ellipse cx="450" cy="466" rx="100" ry="98" fill="#ecccab" stroke-width="3.2"/>
    <g clip-path="url(#faceClip)">
      <path d="M500 360 C570 420 570 520 500 570 L570 570 L570 360 Z" fill="url(#hatch)" stroke="none" opacity="0.55"/>
    </g>
    <!-- kel kafada minik parlama -->
    <path d="M400 392 C416 380 436 374 456 374" fill="none" stroke="#faf0de" stroke-width="5"/>

    <!-- iri, yuvarlak bebek gözleri (yüzün alt yarısında), parmağa bakıyor -->
    <ellipse cx="416" cy="490" rx="21" ry="23" fill="#faf3e2" stroke-width="2.4"/>
    <ellipse cx="484" cy="490" rx="21" ry="23" fill="#faf3e2" stroke-width="2.4"/>
    <circle cx="421" cy="486" r="13" fill="#3b4a3a" stroke="none"/>
    <circle cx="489" cy="486" r="13" fill="#3b4a3a" stroke="none"/>
    <circle cx="422" cy="486" r="6" fill="#120c08" stroke="none"/>
    <circle cx="490" cy="486" r="6" fill="#120c08" stroke="none"/>
    <circle cx="417" cy="481" r="3.2" fill="#fff8e0" stroke="none"/>
    <circle cx="485" cy="481" r="3.2" fill="#fff8e0" stroke="none"/>
    <!-- hafif kaşlar -->
    <path d="M398 456 C406 450 422 450 430 455 M470 455 C478 450 494 450 502 456" fill="none" stroke-width="1.8" opacity="0.7"/>
    <!-- minik burun ve şaşkın "o" ağız -->
    <path d="M446 518 C450 522 454 522 458 518" fill="none" stroke-width="2"/>
    <ellipse cx="452" cy="540" rx="7" ry="5.5" fill="#b5655a" stroke-width="1.8"/>
    <!-- tombul yanaklar -->
    <circle cx="396" cy="524" r="15" fill="#e3a58f" stroke="none" opacity="0.6"/>
    <circle cx="506" cy="524" r="15" fill="#e3a58f" stroke="none" opacity="0.6"/>
  </g>

  <rect width="900" height="1200" fill="#ece2cb" opacity="0.001" filter="url(#paper)"/>
  <text x="40" y="1170" font-family="Georgia, serif" font-size="30" fill="#2b1e18" letter-spacing="6">ILO</text>
</svg>
