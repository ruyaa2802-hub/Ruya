<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <defs>
    <!-- kâğıt dokusu -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.18  0 0 0 0.10 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <!-- hafif titrek el çizgisi -->
    <filter id="wobble">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="2" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="3"/>
    </filter>
    <!-- tarama desenleri -->
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a2a22" stroke-width="1.1" opacity="0.55"/>
    </pattern>
    <pattern id="cross" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#3a2a22" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="0" x2="7" y2="0" stroke="#3a2a22" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.9" fill="#3a2a22" opacity="0.45"/>
    </pattern>
    <radialGradient id="eyeglow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#fbe27a"/>
      <stop offset="1" stop-color="#e8b21e"/>
    </radialGradient>
    <clipPath id="headClip">
      <path d="M450 70 C600 70 640 210 625 330 C612 450 560 540 450 548 C340 540 288 450 275 330 C260 210 300 70 450 70 Z"/>
    </clipPath>
    <clipPath id="eyeL"><ellipse cx="370" cy="322" rx="70" ry="88"/></clipPath>
    <clipPath id="eyeR"><ellipse cx="530" cy="322" rx="70" ry="88"/></clipPath>
    <clipPath id="hornClip"><path d="M422 86 C424 0 440 -100 476 -192 C470 -100 474 0 480 86 Z"/></clipPath>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <!-- arka plan -->
  <rect width="900" height="1200" fill="#ece2cb"/>
  <rect width="900" height="1200" fill="url(#dots)" opacity="0.25"/>
  <!-- uzak ufuk: pembe sis ve iki ay -->
  <path d="M0 980 C200 940 350 1000 520 960 C680 925 800 970 900 950 L900 1200 L0 1200 Z" fill="#d9b9ad"/>
  <circle cx="140" cy="170" r="46" fill="#e9d6a8" stroke="#3a2a22" stroke-width="2"/>
  <circle cx="190" cy="120" r="18" fill="#e9d6a8" stroke="#3a2a22" stroke-width="2"/>

  <g filter="url(#wobble)" stroke="#2b1e18" stroke-linejoin="round" stroke-linecap="round" transform="translate(144 160) scale(0.68)">

    <!-- VÜCUDU SARAN DAR KIYAFET -->
    <path d="M318 712 C326 780 352 880 384 950 C370 990 358 1030 362 1070 C370 1200 392 1340 402 1452 L436 1452 C440 1330 446 1200 450 1100 C454 1200 460 1330 464 1452 L498 1452 C508 1340 530 1200 538 1070 C542 1030 530 990 516 950 C548 880 574 780 582 712 Z" fill="#6f8f86" stroke-width="3"/>
    <path d="M450 712 L582 712 C574 780 548 880 516 950 C530 990 542 1030 538 1070 C530 1200 508 1340 498 1452 L464 1452 C460 1330 454 1200 450 1100 Z" fill="url(#hatch)" stroke="none"/>
    <!-- dikiş çizgileri vücut hatlarını takip ediyor -->
    <path d="M336 770 C400 812 500 812 564 770" fill="none" stroke-width="1.8"/>
    <path d="M450 745 L450 1095" fill="none" stroke-width="1.8"/>
    <path d="M372 1020 C400 1035 500 1035 528 1020" fill="none" stroke-width="1.6"/>
    <path d="M392 1250 C405 1260 425 1260 440 1250 M460 1250 C475 1260 495 1260 508 1250" fill="none" stroke-width="1.6"/>
    <!-- altın kemer ve göz rengindeki taş -->
    <path d="M380 942 C420 960 480 960 520 942 L524 966 C480 984 420 984 376 966 Z" fill="#d6a52a" stroke-width="2.5"/>
    <ellipse cx="450" cy="964" rx="10" ry="8" fill="#f2c230" stroke-width="2.2"/>
    <circle cx="447" cy="961" r="2.4" fill="#fff8e0" stroke="none"/>
    <!-- uzun, sivri çıplak ayaklar -->
    <path d="M402 1450 C392 1470 370 1482 346 1488 C380 1494 420 1492 438 1478 L436 1450 Z" fill="#8e6aa8" stroke-width="2.8"/>
    <path d="M498 1450 C508 1470 530 1482 554 1488 C520 1494 480 1492 462 1478 L464 1450 Z" fill="#8e6aa8" stroke-width="2.8"/>

    <!-- SOL KOL (aşağıda, gövdeye yapışık, absürt uzun) -->
    <path d="M305 700 C250 760 230 860 238 980 C240 1010 262 1012 266 985 C270 880 285 790 330 720 Z" fill="#8e6aa8" stroke-width="3"/>
    <path d="M238 980 l-14 70 M248 990 l-4 78 M258 990 l8 74 M266 985 l20 62" fill="none" stroke-width="3"/>

    <!-- SAĞ KOL (kalkık, avucunda Ilo) -->
    <path d="M595 700 C680 690 740 640 760 560 C768 530 745 520 735 548 C712 615 660 650 585 668 Z" fill="#8e6aa8" stroke-width="3"/>
    <path d="M700 640 C730 600 745 570 750 555" fill="none" stroke="url(#hatch)" stroke-width="14" opacity="0.8"/>
    <!-- avuç -->
    <path d="M700 545 C700 510 790 505 800 540 C805 565 760 580 735 575 C715 572 700 565 700 545 Z" fill="#8e6aa8" stroke-width="3"/>
    <!-- altı uzun parmak -->
    <path d="M708 540 C690 500 688 470 694 440" fill="none" stroke-width="7"/>
    <path d="M725 530 C716 480 716 440 724 405" fill="none" stroke-width="7"/>
    <path d="M745 526 C746 476 752 436 764 400" fill="none" stroke-width="7"/>
    <path d="M766 528 C778 485 792 452 808 425" fill="none" stroke-width="7"/>
    <path d="M786 535 C808 505 828 485 848 472" fill="none" stroke-width="7"/>
    <path d="M798 552 C826 548 850 548 872 556" fill="none" stroke-width="7"/>
    <path d="M708 540 C690 500 688 470 694 440" fill="none" stroke="#8e6aa8" stroke-width="3"/>
    <path d="M725 530 C716 480 716 440 724 405" fill="none" stroke="#8e6aa8" stroke-width="3"/>
    <path d="M745 526 C746 476 752 436 764 400" fill="none" stroke="#8e6aa8" stroke-width="3"/>
    <path d="M766 528 C778 485 792 452 808 425" fill="none" stroke="#8e6aa8" stroke-width="3"/>
    <path d="M786 535 C808 505 828 485 848 472" fill="none" stroke="#8e6aa8" stroke-width="3"/>
    <path d="M798 552 C826 548 850 548 872 556" fill="none" stroke="#8e6aa8" stroke-width="3"/>

    <!-- avuçtaki minik Ilo -->
    <g transform="translate(752 498)" stroke-width="1.5">
      <path d="M0 -38 C-10 -60 -4 -75 6 -82 M2 -38 C12 -58 18 -66 14 -80" fill="none" stroke="#2b1e18"/>
      <circle cx="0" cy="-32" r="7" fill="#e7cfb4"/>
      <path d="M-7 -24 L7 -24 L10 6 L-10 6 Z" fill="#e8dcc0"/>
      <path d="M-4 6 L-4 18 M4 6 L4 18" fill="none"/>
    </g>

    <!-- UZUN İNCE BOYUN -->
    <path d="M415 530 C418 600 412 660 405 700 L495 700 C488 660 482 600 485 530 Z" fill="#8e6aa8" stroke-width="3"/>
    <path d="M460 535 C462 600 470 660 478 700 L495 700 C488 660 482 600 485 530 Z" fill="url(#hatch)" stroke="none"/>
    <!-- boyun halkaları -->
    <path d="M418 575 C440 585 462 585 484 575 M416 615 C440 626 462 626 486 615 M412 655 C440 667 462 667 489 655" fill="none" stroke-width="1.8"/>

    <!-- FIRFIRLI YAKA -->
    <g fill="#efe7d6" stroke-width="2.5">
      <path d="M300 700 C300 670 340 660 350 690 C360 660 400 660 405 690 C412 658 450 655 455 690 C462 655 500 658 505 690 C510 660 550 660 555 690 C565 660 600 670 600 700 C570 735 520 745 450 745 C380 745 330 735 300 700 Z"/>
      <path d="M350 690 C352 715 360 730 372 742 M405 690 C405 715 410 732 418 745 M455 690 C455 715 455 732 455 745 M505 690 C504 715 498 732 492 745 M555 690 C552 715 542 730 530 742" fill="none" stroke-width="1.6"/>
    </g>

    <!-- KAFA: dev, yumurta biçimli, kel -->
    <path d="M450 70 C600 70 640 210 625 330 C612 450 560 540 450 548 C340 540 288 450 275 330 C260 210 300 70 450 70 Z" fill="#9a78b4" stroke-width="3.5"/>
    <!-- kafa gölgesi (sağ taraf tarama) -->
    <g clip-path="url(#headClip)">
      <path d="M540 60 C625 160 640 380 540 560 L700 560 L700 60 Z" fill="url(#cross)" stroke="none"/><path d="M540 60 C625 160 640 380 540 560 L700 560 L700 60 Z" fill="#3b2550" opacity="0.18" stroke="none"/>
      <!-- alın kırışıkları -->
      <path d="M360 182 C400 167 500 167 540 182 M375 208 C410 196 490 196 525 208" fill="none" stroke-width="1.8"/>
    </g>

    <!-- SÜSLÜ TEK BOYNUZ (Velunlara özel) -->
    <g id="boynuz" transform="translate(0 22)">
      <path d="M422 86 C424 0 440 -100 476 -192 C470 -100 474 0 480 86 Z" fill="#efe4cc" stroke-width="3"/>
      <g clip-path="url(#hornClip)">
        <!-- sarmal altın bantlar -->
        <g fill="none" stroke="#d6a52a" stroke-width="7">
          <path d="M390 70 L520 40"/><path d="M390 30 L520 0"/><path d="M390 -10 L520 -40"/>
          <path d="M390 -50 L520 -80"/><path d="M390 -90 L520 -120"/><path d="M390 -130 L520 -160"/>
        </g>
        <g fill="none" stroke="#2b1e18" stroke-width="1.4">
          <path d="M390 66 L520 36"/><path d="M390 74 L520 44"/><path d="M390 26 L520 -4"/><path d="M390 34 L520 4"/>
          <path d="M390 -14 L520 -44"/><path d="M390 -6 L520 -36"/><path d="M390 -54 L520 -84"/><path d="M390 -46 L520 -76"/>
          <path d="M390 -94 L520 -124"/><path d="M390 -86 L520 -116"/><path d="M390 -134 L520 -164"/><path d="M390 -126 L520 -156"/>
        </g>
        <!-- bantlar arası oyma noktalar -->
        <g fill="#2b1e18" stroke="none">
          <circle cx="440" cy="52" r="2"/><circle cx="458" cy="47" r="2"/>
          <circle cx="446" cy="12" r="2"/><circle cx="462" cy="8" r="2"/>
          <circle cx="451" cy="-28" r="2"/><circle cx="465" cy="-31" r="2"/>
          <circle cx="458" cy="-68" r="2"/><circle cx="468" cy="-71" r="2"/>
          <circle cx="465" cy="-108" r="1.8"/><circle cx="471" cy="-146" r="1.6"/>
        </g>
        <!-- sağ taraf gölge taraması -->
        <path d="M462 90 C460 0 466 -100 480 -200 L540 -200 L540 90 Z" fill="url(#hatch)" stroke="none"/>
      </g>
      <path d="M422 86 C424 0 440 -100 476 -192 C470 -100 474 0 480 86 Z" fill="none" stroke-width="3"/>

      <!-- tepe süsü -->
      <circle cx="476" cy="-196" r="8" fill="#f2c230" stroke-width="2.5"/>
      <circle cx="473" cy="-199" r="2.2" fill="#fff8e0" stroke="none"/>

      <!-- orta halka ve sarkan boncuk zincirleri -->
      <ellipse cx="458" cy="-30" rx="19" ry="6" fill="#d6a52a" stroke-width="2.2"/>
      <path d="M441 -28 C428 -5 422 20 420 46" fill="none" stroke="#b8861a" stroke-width="1.8" stroke-dasharray="2 4"/>
      <path d="M476 -28 C490 -5 498 22 500 50" fill="none" stroke="#b8861a" stroke-width="1.8" stroke-dasharray="2 4"/>
      <circle cx="420" cy="52" r="6" fill="#f2c230" stroke-width="2"/>
      <circle cx="500" cy="56" r="6" fill="#f2c230" stroke-width="2"/>
      <path d="M420 58 l-4 12 l4 6 l4 -6 Z" fill="#7b5895" stroke-width="1.6"/>
      <path d="M500 62 l-4 12 l4 6 l4 -6 Z" fill="#7b5895" stroke-width="1.6"/>

      <!-- taban tacı ve göz rengiyle aynı taş -->
      <path d="M408 96 C424 68 478 68 494 96 C476 108 426 108 408 96 Z" fill="#d6a52a" stroke-width="2.8"/>
      <path d="M414 92 C430 76 472 76 488 92" fill="none" stroke-width="1.4"/>
      <g fill="#2b1e18" stroke="none">
        <circle cx="420" cy="95" r="2"/><circle cx="432" cy="99" r="2"/><circle cx="470" cy="99" r="2"/><circle cx="482" cy="95" r="2"/>
      </g>
      <ellipse cx="451" cy="96" rx="10" ry="8" fill="#f2c230" stroke-width="2.4"/>
      <circle cx="448" cy="93" r="2.4" fill="#fff8e0" stroke="none"/>
    </g>
    <!-- minik yelpaze kulaklar yerine: iki sarkık ince et ipliği -->
    <path d="M280 360 C250 380 240 430 252 470" fill="none" stroke-width="3"/>
    <path d="M620 360 C650 380 660 430 648 470" fill="none" stroke-width="3"/>
    <circle cx="252" cy="474" r="6" fill="#8e6aa8" stroke-width="2"/>
    <circle cx="648" cy="474" r="6" fill="#8e6aa8" stroke-width="2"/>

    <!-- gözlerin etrafında buğulu siyah halka -->
    <g clip-path="url(#headClip)" filter="url(#smoke)" stroke="none">
      <ellipse cx="370" cy="326" rx="82" ry="100" fill="#140c18" opacity="0.4"/>
      <ellipse cx="530" cy="326" rx="82" ry="100" fill="#140c18" opacity="0.4"/>
    </g>
    <!-- KOCAMAN SARI GÖZLER -->
    <ellipse cx="370" cy="322" rx="70" ry="88" fill="url(#eyeglow)" stroke-width="3.5"/>
    <ellipse cx="530" cy="322" rx="70" ry="88" fill="url(#eyeglow)" stroke-width="3.5"/>
    <!-- iris halkaları -->
    <g fill="none" stroke="#b07c10" stroke-width="1.4" opacity="0.8">
      <ellipse cx="384" cy="345" rx="40" ry="50"/>
      <ellipse cx="544" cy="345" rx="40" ry="50"/>
    </g>
    <!-- minicik göz bebekleri: avuçtaki Ilo'ya bakıyor -->
    <circle cx="400" cy="355" r="9" fill="#120c08" stroke="none"/>
    <circle cx="560" cy="355" r="9" fill="#120c08" stroke="none"/>
    <circle cx="396" cy="351" r="2.6" fill="#fff8e0" stroke="none"/>
    <circle cx="556" cy="351" r="2.6" fill="#fff8e0" stroke="none"/>
    <!-- ağır üst göz kapakları (uykulu, kayıtsız bakış) -->
    <g clip-path="url(#eyeL)">
      <path d="M290 220 L470 220 L470 282 C410 268 330 268 290 298 Z" fill="#7b5895" stroke-width="3"/>
      <path d="M290 220 L470 220 L470 282 C410 268 330 268 290 298 Z" fill="url(#hatch)" stroke="none"/>
    </g>
    <g clip-path="url(#eyeR)">
      <path d="M450 220 L610 220 L610 290 C570 268 490 268 450 292 Z" fill="#7b5895" stroke-width="3"/>
      <path d="M450 220 L610 220 L610 290 C570 268 490 268 450 292 Z" fill="url(#hatch)" stroke="none"/>
    </g>
    <path d="M298 296 C330 270 410 268 440 290" fill="none" stroke-width="3"/>
    <path d="M460 290 C490 268 570 270 602 296" fill="none" stroke-width="3"/>

    <!-- burun: sadece iki küçük delik -->
    <ellipse cx="440" cy="438" rx="3.5" ry="5" fill="#2b1e18" stroke="none"/>
    <ellipse cx="460" cy="438" rx="3.5" ry="5" fill="#2b1e18" stroke="none"/>
    <!-- minik, ifadesiz ağız -->
    <path d="M430 482 C442 486 458 486 470 482" fill="none" stroke-width="3"/>
    <path d="M436 494 C446 497 454 497 464 494" fill="none" stroke-width="1.4" opacity="0.6"/>

    <!-- alında üçüncü, kapalı göz (absürt detay) -->
    <path d="M432 150 C442 142 458 142 468 150 C458 156 442 156 432 150 Z" fill="#7b5895" stroke-width="2"/>
    <path d="M432 150 C442 156 458 156 468 150" fill="none" stroke-width="2"/>
  </g>

  <!-- kâğıt dokusu katmanı -->
  <rect width="900" height="1200" fill="#ece2cb" opacity="0.001" filter="url(#paper)"/>

  <!-- etiket -->
  <text x="40" y="1170" font-family="Georgia, serif" font-size="30" fill="#2b1e18" letter-spacing="6">VELUN</text>
</svg>
