{

}

// ---------- zaman çizelgesi

// mesafe tabloları (yürüme fazı için)
function distTable(fn, T0, T1) { const dt = 1 / 120; const tab = []; let d = 0, prev = fn(T0); for (let t = T0; t <= T1 + 1e-6; t += dt) { const c = fn(t); if (c[0] !== null && prev[0] !== null) d += Math.hypot(c[0] - prev[0], c[1] - prev[1]); tab.push(d); prev = c; } return t => tab[clamp(Math.round((t - T0) * 120), 0, tab.length - 1)]; }
const pDist = distTable(pikoPath, 0, 21), mDist = distTable(mokoPath, 0, 30);
const speed = (dist, t) => (dist(t + 0.05) - dist(t - 0.05)) / 0.1;

function update(t) {
