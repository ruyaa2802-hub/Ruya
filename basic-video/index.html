<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0f1020;
        --ink: #ffffff;
        --accent: #ff7a59;
        --accent2: #7c5cff;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background: linear-gradient(135deg, #0f1020 0%, #1d1b4b 100%);
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
      }
      #orb1 { width: 520px; height: 520px; left: -120px; top: -140px; background: radial-gradient(circle, var(--accent2), transparent 70%); }
      #orb2 { width: 640px; height: 640px; right: -180px; bottom: -220px; background: radial-gradient(circle, var(--accent), transparent 70%); }
      #content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #title {
        color: var(--ink);
        font-size: 150px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      #subtitle {
        color: #c9c8ee;
        font-size: 48px;
        font-weight: 400;
        letter-spacing: 0.02em;
      }
      #bar {
        width: 0;
        height: 10px;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--accent2), var(--accent));
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="orb1" class="orb clip" data-layout-allow-overflow data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="orb2" class="orb clip" data-layout-allow-overflow data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="content">
        <h1 id="title" class="clip" data-start="0" data-duration="6" data-track-index="2">Merhaba HyperFrames</h1>
        <p id="subtitle" class="clip" data-start="0" data-duration="6" data-track-index="3">HTML ile yazılan ilk videom</p>
        <div id="bar" class="clip" data-start="0" data-duration="6" data-track-index="4"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#orb1", { x: -80, y: -40 }, { x: 120, y: 60, duration: 6, ease: "sine.inOut" }, 0);
      tl.fromTo("#orb2", { x: 80, y: 40 }, { x: -120, y: -60, duration: 6, ease: "sine.inOut" }, 0);
      tl.fromTo("#title", { opacity: 0.15, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1, ease: "power3.out" }, 0);
      tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.2);
      tl.to("#bar", { width: 560, duration: 1.4, ease: "power2.inOut" }, 1.8);
      tl.to("#content", { opacity: 0, duration: 0.6, ease: "power1.in" }, 5.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
