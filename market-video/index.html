      <div id="damla" class="char clip" data-start="0" data-duration="12" data-track-index="4"><img src="characters/damla.svg" alt="Damla" /></div>
      <div id="bDamla" class="bubble clip" data-start="0" data-duration="12" data-track-index="5">Anne, bak! Elma!</div>
      <div id="bMom" class="bubble clip" data-start="0" data-duration="12" data-track-index="6">Tamam kızım, alalım.</div>
      <div id="title" class="clip" data-start="0" data-duration="12" data-track-index="7"><span>Damla ve Annesi Markette</span></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // aisle scrolls: walk, stop at fruit shelf, walk on
      tl.fromTo("#track", { x: 0 }, { x: -1700, duration: 5, ease: "power2.out" }, 0);
      tl.to("#track", { x: -3550, duration: 4, ease: "power1.inOut" }, 8);

      // walking bob (two characters, offset phase)
      function walk(sel, from, to, amp, rot, phase) {
        const step = 0.4; let k = 0;
        for (let t = from + phase; t < to; t += step, k++) {
          const dir = k % 2 ? 1 : -1;
          tl.to(sel, { y: -amp, rotation: rot * dir, duration: step / 2, ease: "sine.out" }, t);
          tl.to(sel, { y: 0, rotation: rot * dir * 0.3, duration: step / 2, ease: "sine.in" }, t + step / 2);
        }
        tl.to(sel, { y: 0, rotation: 0, duration: 0.2, ease: "power2.out" }, to);
      }
      walk("#mom", 0, 4.6, 12, 1.6, 0);
      walk("#damla", 0, 4.6, 18, 3, 0.2);
      walk("#mom", 8, 11.6, 12, 1.6, 0);
      walk("#damla", 8, 11.6, 18, 3, 0.2);

      // title card fades after intro
      tl.to("#title", { opacity: 0, y: -30, duration: 0.6, ease: "power2.in" }, 2.4);

      // stop at fruit: Damla jumps and talks, mom answers
      tl.to("#damla", { y: -60, scaleY: 1.04, duration: 0.25, ease: "power2.out" }, 5.1);
      tl.to("#damla", { y: 0, scaleY: 1, duration: 0.3, ease: "bounce.out" }, 5.35);
      tl.to("#damla", { y: -40, duration: 0.22, ease: "power2.out" }, 6.0);
      tl.to("#damla", { y: 0, duration: 0.3, ease: "bounce.out" }, 6.22);
      tl.fromTo("#bDamla", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 5.2);
      tl.to("#bDamla", { opacity: 0, scale: 0.9, duration: 0.3 }, 7.0);
      tl.to("#mom", { rotation: -3, duration: 0.5, ease: "sine.inOut" }, 6.3);
      tl.fromTo("#bMom", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 6.6);
      tl.to("#bMom", { opacity: 0, scale: 0.9, duration: 0.3 }, 7.8);
      tl.to("#mom", { rotation: 0, duration: 0.3 }, 7.7);

      // end fade
      tl.to("#root", { opacity: 0, duration: 0.5, ease: "power1.in" }, 11.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
