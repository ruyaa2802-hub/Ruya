<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Pirilumo kanal başlığı</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 2560px; height: 1440px; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 2560px; height: 1440px; }
  /* YouTube banner areas: TV = full, desktop = 2560×423 band, all devices (safe) = 1546×423 */
  .g { position: absolute; border: 6px dashed; display: none; box-sizing: border-box; }
  #gDesk { left: 0; top: 508px; width: 2560px; height: 423px; border-color: #ff3b3b; }
  #gSafe { left: 507px; top: 508px; width: 1546px; height: 423px; border-color: #ffe03b; }
  body.guide .g { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"><canvas id="c" width="2560" height="1440"></canvas><div id="gDesk" class="g"></div><div id="gSafe" class="g"></div></div>
<script type="module">
import * as THREE from 'three';
import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
import { Font } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Post } from '../scene/js/post.js';
import { rng, softDotTexture } from '../scene/js/util.js';
import { createBee } from '../scene/js/bee.js';
import { createFoxSitting, createPandaSitting, createOwlOnStump } from './hayvanlar.js';
import { createLion, createElephant, createPenguin } from './hayvanlar2.js';

const W = 2560, H = 1440;
const P = new URLSearchParams(location.search);
const num = (k, d) => parseFloat(P.get(k) ?? d);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const post = new Post(renderer, W, H);
const R = rng(11);
const scene = new THREE.Scene();
const ANIMAL_SPOTS = [[-9.2, -0.6], [-6.9, 0.1], [-5.0, -0.2], [5.0, -0.2], [6.9, 0.1], [9.2, -0.6]];

// ---------- sky ----------
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  vertexShader: `varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying vec3 d; void main(){ float h = max(d.y, 0.);
    vec3 c = mix(vec3(0.62,0.86,1.0), vec3(0.08,0.36,0.92), pow(h, 0.5));
    float s = max(dot(normalize(d), normalize(vec3(-0.35,0.3,-0.9))), 0.);
    c += vec3(1.0,0.88,0.6) * pow(s, 8.) * 0.7;
    gl_FragColor = vec4(c, 1.); }`,
})));
scene.fog = new THREE.Fog(new THREE.Color().setRGB(0.6, 0.82, 0.98), 60, 260);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xd6ebff, 0x4f7a2a, 1.25));
const key = new THREE.DirectionalLight(0xfff0d8, 3.5);
key.position.set(-10, 16, 22);
key.target.position.set(0, 0, 0);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
Object.assign(key.shadow.camera, { left: -13, right: 13, top: 8, bottom: -8, near: 1, far: 90 });
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xfff0b0, 2.2);
rim.position.set(10, 8, -14);
scene.add(rim);

// ---------- meadow ----------
const GR = 220;
const groundY = (x, z) => Math.sqrt(GR * GR - x * x - z * z) - GR;
const ground = new THREE.Mesh(new THREE.SphereGeometry(GR, 256, 128), new THREE.MeshStandardMaterial({ color: '#5fb04a', roughness: 1 }));
ground.position.y = -GR;
ground.receiveShadow = true;
scene.add(ground);
{
  const blade = new THREE.PlaneGeometry(0.07, 1, 1, 3);
  blade.translate(0, 0.5, 0);
  const p = blade.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i); p.setX(i, p.getX(i) * (1 - y * 0.9)); p.setZ(i, y * y * 0.15); }
  blade.computeVertexNormals();
  const N = 60000;
  const im = new THREE.InstancedMesh(blade, new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.9 }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  let k = 0;
  while (k < N) {
    const z = -6 + R() * 30, x = (R() - 0.5) * (34 + Math.max(0, z - 6) * 0.7);
    const low = Math.abs(x) < 4.6 && z > 1.0 && z < 10; // short grass in front of the lettering so it never hides the tag
    q.setFromEuler(new THREE.Euler((R() - 0.5) * 0.5, R() * 6.28, (R() - 0.5) * 0.5));
    m.compose(new THREE.Vector3(x, groundY(x, z) - 0.02, z), q, new THREE.Vector3(1, low ? 0.08 + R() * 0.06 : 0.25 + R() * 0.35, 1));
    im.setMatrixAt(k, m);
    im.setColorAt(k, c.setHSL(0.24 + R() * 0.06, 0.6, 0.3 + R() * 0.15));
    k++;
  }
  im.receiveShadow = true;
  scene.add(im);
}
// flowers
{
  const petal = new THREE.SphereGeometry(1, 10, 6);
  const parts = [];
  for (let i = 0; i < 8; i++) { const g = petal.clone(); g.scale(0.07, 0.015, 0.17); g.translate(0, 0, 0.2); g.rotateY((i / 8) * Math.PI * 2); parts.push(g); }
  const headGeo = mergeGeometries(parts);
  const stemGeo = new THREE.CylinderGeometry(0.015, 0.02, 1, 5);
  stemGeo.translate(0, 0.5, 0);
  const COLS = ['#ffffff', '#ff7fb0', '#ffd23d', '#b98cff', '#ff8a3d', '#ffffff', '#7fc3ff'];
  const N = 520;
  const heads = new THREE.InstancedMesh(headGeo, new THREE.MeshStandardMaterial({ roughness: 0.5, side: THREE.DoubleSide }), N);
  const centers = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 12, 8), new THREE.MeshStandardMaterial({ color: '#ffc61a', roughness: 0.8 }), N);
  const stems = new THREE.InstancedMesh(stemGeo, new THREE.MeshStandardMaterial({ color: '#3f8a2a' }), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), c = new THREE.Color();
  let k = 0;
  while (k < N) {
    const z = -5 + R() * 28, x = (R() - 0.5) * (32 + Math.max(0, z - 5) * 0.7);
    if (Math.abs(x) < 4.6 && z > 0.6 && z < 10.5) continue;
    if (ANIMAL_SPOTS.some(([sx, sz]) => Math.hypot(x - sx, z - sz) < 1.1)) continue;
    const y = groundY(x, z), h = 0.25 + R() * 0.4, s = 0.9 + R() * 0.6;
    m.compose(new THREE.Vector3(x, y, z), q.identity(), new THREE.Vector3(1, h, 1)); stems.setMatrixAt(k, m);
    q.setFromEuler(new THREE.Euler((R() - 0.5) * 0.6, R() * 6, (R() - 0.5) * 0.6));
    m.compose(new THREE.Vector3(x, y + h, z), q, new THREE.Vector3(s, s, s));
    heads.setMatrixAt(k, m); centers.setMatrixAt(k, m);
    heads.setColorAt(k, c.set(COLS[k % COLS.length]));
    k++;
  }
  for (const o of [heads, centers, stems]) { o.castShadow = true; o.receiveShadow = true; scene.add(o); }
}
// trees, bushes, hills, clouds
{
  const blob = new THREE.IcosahedronGeometry(1, 3);
  const trunk = new THREE.CylinderGeometry(0.3, 0.45, 1, 8);
  trunk.translate(0, 0.5, 0);
  const leafs = ['#3f8a2c', '#4f9b35', '#367a28', '#5ea83c'].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95 }));
  const trunkM = new THREE.MeshStandardMaterial({ color: '#6a4a2e', roughness: 1 });
  for (let i = 0; i < 22; i++) {
    const x = (i / 21 - 0.5) * 90 + (R() - 0.5) * 3, z = -32 - R() * 18;
    const g = new THREE.Group();
    g.position.set(x, groundY(x, z), z);
    g.scale.setScalar(1.3 + R() * 0.9);
    const t = new THREE.Mesh(trunk, trunkM); t.scale.set(1, 2.6, 1); g.add(t);
    for (let k = 0; k < 4; k++) {
      const b = new THREE.Mesh(blob, leafs[(i + k) % 4]);
      b.position.set((R() - 0.5) * 1.8, 3 + R() * 1.4, (R() - 0.5) * 1.8);
      b.scale.setScalar(1.3 + R() * 0.8);
      g.add(b);
    }
    g.traverse((o) => (o.castShadow = true));
    scene.add(g);
  }
  const hillM = new THREE.MeshStandardMaterial({ color: '#6fae58', roughness: 1 });
  for (let i = 0; i < 9; i++) {
    const h = new THREE.Mesh(blob, hillM);
    h.position.set(-90 + i * 22, -8, -70 - (i % 2) * 12);
    h.scale.set(26, 14 + (i % 3) * 5, 14);
    scene.add(h);
  }
  const cm = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.95, emissive: new THREE.Color('#cfe2ff'), emissiveIntensity: 0.2 });
  [[-15, 7.5, -12, 1.4], [-5, 9.2, -16, 1.1], [7, 8.4, -14, 1.3], [16, 6.6, -11, 1.2], [-21, 4.8, -9, 1.0], [22, 9.5, -18, 1.4], [0, 11, -22, 1.2]].forEach(([x, y, z, s]) => {
    const c = new THREE.Group();
    [[0, 0, 0, 0.75], [0.8, -0.12, 0, 0.58], [-0.8, -0.15, 0, 0.55], [0.3, 0.42, -0.1, 0.58], [-0.35, 0.3, 0.05, 0.5]].forEach(([a, b, d, r]) => { const m = new THREE.Mesh(blob, cm); m.position.set(a, b, d); m.scale.setScalar(r); c.add(m); });
    c.position.set(x, y, z);
    c.scale.setScalar(s);
    scene.add(c);
  });
}

// ---------- the cast (left: elephant, lion, fox — right: panda, penguin, owl) ----------
const cast = [
  [createElephant(), 0.95, 0.55],
  [createLion(), 0.95, 0.4],
  [createFoxSitting(), 0.92, 0.32],
  [createPandaSitting(), 0.86, -0.32],
  [createPenguin(), 1.0, -0.4],
  [createOwlOnStump(), 0.85, -0.55],
];
cast.forEach(([a, s, yaw], i) => {
  const [x, z] = ANIMAL_SPOTS[i];
  a.position.set(x, groundY(x, z), z);
  a.scale.setScalar(s);
  a.rotation.y = yaw;
  scene.add(a);
});
// Pırıltı flying next to the name
const bee = createBee({ hero: true, seed: 1 });
bee.root.position.set(num('bx', 3.2), num('by', 2.95), 2.0);
bee.root.rotation.set(0.1, -0.75, 0.15);
bee.root.scale.setScalar(0.78);
bee.root.traverse((o) => (o.castShadow = true));
bee.setPose({ t: 0.012, wing: 0.7, smile: 1.4, antennaPerk: 0.8 });
scene.add(bee.root);

// ---------- 3D lettering ----------
const ttf = new TTFLoader();
ttf.reversed = true;
const font = new Font(ttf.parse(await (await fetch('./fonts/Inter-Black.otf')).arrayBuffer()));
function text3d(str, size, depth, bevel, mats) {
  const g = new TextGeometry(str, { font, size, depth, curveSegments: 10, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.7, bevelSegments: 5 });
  g.computeBoundingBox();
  const bb = g.boundingBox;
  g.translate(-(bb.max.x + bb.min.x) / 2, -bb.min.y, -depth / 2);
  const m = new THREE.Mesh(g, mats);
  m.castShadow = m.receiveShadow = true;
  m.userData.width = bb.max.x - bb.min.x;
  m.userData.height = bb.max.y - bb.min.y;
  return m;
}
const yellow = new THREE.MeshPhysicalMaterial({ color: '#ffd23d', roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.08 });
const redSide = new THREE.MeshPhysicalMaterial({ color: '#e8530c', roughness: 0.35, clearcoat: 0.6 });
const name = text3d('Pirilumo', num('ns', 1.45), 0.55, 0.09, [yellow, redSide]);
name.position.set(0, num('ny', 1.05), num('nz', 1.6));
name.rotation.x = -0.04;
scene.add(name);
const tag = new THREE.Group();
const label = text3d('Hayvanları Keşfet', 0.36, 0.08, 0.025, [new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.3, clearcoat: 1 }), new THREE.MeshStandardMaterial({ color: '#dfeeff', roughness: 0.4 })]);
const pw = label.userData.width + 0.8, ph = 0.72, pr = ph / 2;
const shape = new THREE.Shape();
shape.moveTo(-pw / 2 + pr, -ph / 2);
shape.lineTo(pw / 2 - pr, -ph / 2);
shape.absarc(pw / 2 - pr, 0, pr, -Math.PI / 2, Math.PI / 2, false);
shape.lineTo(-pw / 2 + pr, ph / 2);
shape.absarc(-pw / 2 + pr, 0, pr, Math.PI / 2, Math.PI * 1.5, false);
const pill = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 5, curveSegments: 24 }),
  new THREE.MeshPhysicalMaterial({ color: '#ff7a1a', roughness: 0.35, clearcoat: 0.7 }));
pill.castShadow = pill.receiveShadow = true;
tag.add(pill);
label.position.set(0, -label.userData.height / 2 + 0.02, 0.27);
tag.add(label);
tag.position.set(0, num('ty', 0.42), num('tz', 2.4));
tag.scale.setScalar(num('ts', 0.95));
scene.add(tag);

// floating pollen sparkles
{
  const N = 160, pos = [];
  for (let i = 0; i < N; i++) pos.push((R() - 0.5) * 30, 0.4 + R() * 5, -3 + R() * 6);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.06, map: softDotTexture(), color: new THREE.Color(2.2, 2.0, 1.4), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
}

// ---------- camera & render ----------
const cam = new THREE.PerspectiveCamera(num('fov', 20), W / H, 0.1, 800);
cam.position.set(0, num('cy', 3.0), num('cz', 34));
cam.lookAt(0, num('ly', 1.35), 0);
post.renderLayer(0, scene, cam, { focus: cam.position.distanceTo(new THREE.Vector3(0, 1.2, 1.0)), aperture: num('ap', 14), maxBlur: 18 });
post.composite({ exposure: 1.06, bloom: 0.35, vignette: 0.25, threshold: 1.4 });
if (P.has('guide')) document.body.classList.add('guide');
window.READY = true;
</script>
</body>
</html>
