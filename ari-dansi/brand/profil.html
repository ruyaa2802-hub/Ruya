<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Pirilumo profil resmi</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 800px; height: 800px; overflow: hidden; font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at 50% 38%, #fff6c9 0%, #ffd75a 30%, #f7a823 62%, #d9780f 100%); }
  /* honeycomb texture */
  #hex { position: absolute; inset: 0; opacity: 0.16; }
  .bokeh { position: absolute; border-radius: 50%; filter: blur(6px); }
  #c { position: absolute; left: 0; top: 0; width: 800px; height: 800px; }
  #name { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font-family: 'Inter Display', 'Inter', sans-serif;
    font-weight: 900; font-size: 136px; letter-spacing: -3px; line-height: 1; color: #fff;
    -webkit-text-stroke: 14px #5a2a04; paint-order: stroke fill;
    filter: drop-shadow(0 7px 0 rgba(70,30,0,0.55)); }
  #name span { -webkit-text-stroke: 0; }
  #tag { position: absolute; left: 50%; top: 668px; transform: translateX(-50%); background: #2f8f3a; color: #fff;
    font-weight: 800; font-size: 36px; letter-spacing: 1px; padding: 8px 26px 10px; border-radius: 30px; white-space: nowrap;
    border: 5px solid #fff4c4; box-shadow: 0 6px 0 rgba(60,30,0,0.35); }
  /* guide for the circular crop (hidden in export) */
  #guide { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px rgba(0,0,0,0.55); display: none; }
  body.guide #guide { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <svg id="hex" width="800" height="800"><defs><pattern id="hp" width="60" height="104" patternUnits="userSpaceOnUse">
    <path d="M30 0 L60 17 L60 52 L30 69 L0 52 L0 17 Z M30 69 L30 104" fill="none" stroke="#7a3d00" stroke-width="4"/></pattern></defs>
    <rect width="800" height="800" fill="url(#hp)"/></svg>
  <div class="bokeh" style="left:90px;top:120px;width:70px;height:70px;background:rgba(255,255,255,0.55)"></div>
  <div class="bokeh" style="left:640px;top:170px;width:46px;height:46px;background:rgba(255,120,170,0.6)"></div>
  <div class="bokeh" style="left:120px;top:420px;width:40px;height:40px;background:rgba(150,110,255,0.5)"></div>
  <div class="bokeh" style="left:660px;top:430px;width:58px;height:58px;background:rgba(255,255,255,0.5)"></div>
  <canvas id="c" width="1600" height="1600"></canvas>
  <div id="name">Pirilumo</div>
  <div id="tag">Hayvanları Keşfet</div>
  <div id="guide"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { createBee } from '../scene/js/bee.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1600, 1600, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff1d0, 0x8a5a20, 1.3));
const key = new THREE.DirectionalLight(0xfff0dc, 3.2);
key.position.set(-2.5, 3, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe0a0, 2.5);
rim.position.set(3, 2, -3);
scene.add(rim);

const bee = createBee({ hero: true, seed: 1 });
scene.add(bee.root);
// face the camera with a friendly head tilt
bee.root.rotation.set(0.12, Math.PI * 0.12, 0);
const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 50);
cam.position.set(0, 0.55, 4.2);
cam.lookAt(0, 0.12, 0.2);
// shift the bee up in frame to leave room for the name
const CUT = new URLSearchParams(location.search).has('cut'); // transparent character cut-out for covers
if (CUT) {
  for (const id of ['hex', 'name', 'tag']) document.getElementById(id).style.display = 'none';
  document.querySelectorAll('.bokeh').forEach((b) => (b.style.display = 'none'));
  document.getElementById('stage').style.background = 'transparent';
  document.body.style.background = 'transparent';
  document.documentElement.style.background = 'transparent';
  cam.position.set(0, 0.45, 5.0);
  cam.lookAt(0, 0.05, 0.1);
} else cam.setViewOffset(1600, 1600, 0, 260, 1600, 1600);

const params = new URLSearchParams(location.search);
const t = parseFloat(params.get('t') ?? '0.012');
bee.setPose({ t, wing: 0.7, smile: 1.45, antennaPerk: 0.8, headRoll: -0.12, headPitch: -0.05, antenna: 0 });
renderer.render(scene, cam);
if (params.has('guide')) document.body.classList.add('guide');
window.READY = true;
</script>
</body>
</html>
