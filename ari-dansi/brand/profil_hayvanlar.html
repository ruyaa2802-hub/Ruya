<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Pirilumo profil resmi</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 800px; height: 800px; overflow: hidden; font-family: 'Inter', sans-serif;
    background: linear-gradient(180deg, #7fd0ff 0%, #b8ecff 42%, #c8f0a0 58%, #63c25b 74%, #3f9a45 100%); }
  #sunglow { position: absolute; left: 470px; top: -120px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,200,0.95) 0%, rgba(255,240,150,0.45) 30%, rgba(255,240,150,0) 70%); }
  #hills { position: absolute; left: 0; top: 330px; }
  .leaf { position: absolute; }
  #c { position: absolute; left: 0; top: 0; width: 800px; height: 800px; }
  #name { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-family: 'Inter Display', 'Inter', sans-serif;
    font-weight: 900; font-size: 140px; letter-spacing: -3px; line-height: 1; color: #fff;
    -webkit-text-stroke: 15px #1f4a1f; paint-order: stroke fill; filter: drop-shadow(0 7px 0 rgba(15,45,15,0.5)); }
  #tag { position: absolute; left: 50%; top: 652px; transform: translateX(-50%); background: #ff8a1c; color: #fff;
    font-weight: 800; font-size: 37px; padding: 8px 26px 10px; border-radius: 30px; white-space: nowrap;
    border: 5px solid #fff6d6; box-shadow: 0 6px 0 rgba(20,60,20,0.4); }
  #guide { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 400px rgba(0,0,0,0.55); display: none; }
  body.guide #guide { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <div id="sunglow"></div>
  <svg id="hills" width="800" height="470" viewBox="0 0 800 470">
    <path d="M0 120 C 150 40, 300 60, 420 110 S 680 60, 800 100 L 800 470 L 0 470 Z" fill="#7ccc5e"/>
    <path d="M0 190 C 180 130, 360 170, 520 150 S 720 120, 800 160 L 800 470 L 0 470 Z" fill="#5bb54d"/>
  </svg>
  <svg class="leaf" style="left:24px;top:470px" width="150" height="150" viewBox="0 0 100 100"><path d="M10 90 C 10 40, 50 10, 90 10 C 90 60, 60 90, 10 90 Z" fill="#2f8f3a"/><path d="M10 90 L 75 25" stroke="#9fe08a" stroke-width="4"/></svg>
  <svg class="leaf" style="left:630px;top:470px;transform:scaleX(-1)" width="150" height="150" viewBox="0 0 100 100"><path d="M10 90 C 10 40, 50 10, 90 10 C 90 60, 60 90, 10 90 Z" fill="#2f8f3a"/><path d="M10 90 L 75 25" stroke="#9fe08a" stroke-width="4"/></svg>
  <canvas id="c" width="1600" height="1600"></canvas>
  <div id="name">Pirilumo</div>
  <div id="tag">🔍 Hayvanları Keşfet</div>
  <div id="guide"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { createFox, createPanda, createOwl } from './hayvanlar.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1600, 1600, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xeaf6ff, 0x5a7a30, 1.4));
const key = new THREE.DirectionalLight(0xfff2dc, 3.0);
key.position.set(-3, 4, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff4c0, 2.2);
rim.position.set(4, 3, -4);
scene.add(rim);

const fox = createFox(), panda = createPanda(), owl = createOwl();
fox.position.set(-2.05, -0.2, -0.3);
fox.rotation.set(0.05, 0.42, 0.16);
owl.position.set(2.05, -0.18, -0.3);
owl.rotation.set(0.05, -0.42, -0.14);
panda.position.set(0, 0.12, 0.35);
panda.scale.setScalar(1.12);
panda.rotation.set(0.04, 0, -0.05);
scene.add(fox, panda, owl);

const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
cam.position.set(0, 0.7, 13.2);
cam.lookAt(0, 0.05, 0);
cam.setViewOffset(1600, 1600, 0, 250, 1600, 1600); // lift the animals into the upper part of the circle
renderer.render(scene, cam);
if (new URLSearchParams(location.search).has('guide')) document.body.classList.add('guide');
window.READY = true;
</script>
</body>
</html>
