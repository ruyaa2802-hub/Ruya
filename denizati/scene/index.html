<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Deniz Atlarının Şaşırtıcı Dünyası</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Inter', 'Noto Color Emoji', sans-serif; }
  #c { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .o { position: absolute; opacity: 0; will-change: opacity, transform; }
  .big { left: 50%; top: 250px; text-align: center; white-space: nowrap; transform-origin: 50% 60%;
    font-family: 'Inter Display', 'Inter', 'Noto Color Emoji', sans-serif; font-weight: 900; line-height: 1.02; letter-spacing: -0.01em; }
  .big span { display: block; background: linear-gradient(180deg, #fff6a8 0%, #ffd23f 45%, #ff8a1f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px rgba(80, 30, 0, 0.55); filter: drop-shadow(0 6px 0 rgba(0, 40, 70, 0.55)) drop-shadow(0 10px 24px rgba(0,0,0,0.45)); }
  .big small { display: block; font-size: 44px; font-weight: 800; color: #fff; margin-top: 10px; text-shadow: 0 3px 10px rgba(0,0,0,0.6); }
  #hook span { font-size: 116px; }
  #males span { font-size: 86px; }
  #hundreds span { font-size: 128px; }
  #next { top: 300px; }
  #next span { font-size: 92px; }
  .emoji { -webkit-text-stroke: 0; background: none !important; color: initial !important; filter: none !important; display: inline !important; }
  .chip { left: 50%; top: 250px; background: rgba(255, 255, 255, 0.92); border-radius: 28px; padding: 14px 30px; color: #0b3b52;
    font-weight: 800; font-size: 40px; white-space: nowrap; text-align: center; box-shadow: 0 8px 24px rgba(0, 40, 70, 0.35); }
  .chip small { display: block; font-size: 30px; font-weight: 700; color: #e0306f; margin-top: 4px; }
  .tag { background: #fff; color: #0b3b52; font-weight: 800; font-size: 34px; padding: 8px 20px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,40,70,0.35); }
  .tag.o2 { background: #ff8a1f; color: #fff; }
  #stages { left: 50%; top: 260px; display: flex; gap: 14px; align-items: center; white-space: nowrap; }
  #stages div { background: rgba(255,255,255,0.55); color: #0b3b52; font-weight: 800; font-size: 32px; padding: 10px 18px; border-radius: 18px; transition: none; }
  #stages div.on { background: #ffd23f; box-shadow: 0 0 0 4px #fff, 0 8px 20px rgba(0,0,0,0.3); }
  #stages i { color: #fff; font-style: normal; font-size: 34px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  #comment { left: 50%; top: 560px; background: #ff4f8b; color: #fff; font-weight: 900; font-size: 54px; padding: 14px 34px; border-radius: 999px; white-space: nowrap; box-shadow: 0 10px 26px rgba(120,0,40,0.4); }
  #brand { left: 50%; top: 700px; display: flex; align-items: center; gap: 14px; font-family: 'Inter Display', 'Inter', sans-serif; font-weight: 800; font-size: 40px; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,0.6); white-space: nowrap; }
  #brand img { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; }
  #sub { text-wrap: balance; left: 50%; bottom: 430px; max-width: 900px; width: max-content; text-align: center; font-weight: 600; font-size: 46px; line-height: 1.2;
    color: #fff; background: rgba(5, 30, 45, 0.6); padding: 8px 26px 11px; border-radius: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); transform-origin: 50% 100%; }
  #sub b { color: #ffd23f; font-weight: 800; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ov">
    <div id="hook" class="o big"><span>DOĞUM YAPAN</span><span>BABA?!</span></div>
    <div id="males" class="o big"><span>ERKEK DENİZ ATLARI</span><span>DOĞUM YAPAR!</span></div>
    <div id="hundreds" class="o big"><span>YÜZLERCE</span><span>YAVRU!</span></div>
    <div id="next" class="o big"><span>Sıradaki hayvan</span><span>hangisi? <b class="emoji">🐠</b></span></div>
    <div id="comment" class="o">Yorumlara yaz! 💬</div>
    <div id="brand" class="o"><img src="./assets/logo.png" alt="">Pirilumo</div>
    <div id="pair" class="o chip">Bazı türler: aynı eşle 💞<small>birden fazla üreme döneminde birlikte</small></div>
    <div id="dance" class="o chip">Her gün selamlaşma dansı! 💃<small>Renkleri bile parlayabiliyor</small></div>
    <div id="stages" class="o"><div id="st1">🥚 Yumurta</div><i>→</i><div id="st2">Embriyo</div><i>→</i><div id="st3">Minik deniz atı</div></div>
    <div id="lPouch" class="o tag o2">Kuluçka kesesi</div>
    <div id="lEggs" class="o tag">Yumurtalar</div>
    <div id="sub" class="o"></div>
  </div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
