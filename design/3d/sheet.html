<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script>window.onerror=()=>{window.DONE=true}</script><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeStrawberry } from './berry.js';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});

const rim2=new THREE.DirectionalLight('#ffd0a0',1.2); rim2.position.set(-5,2,-4); scene.add(rim2);

const han=makeStrawberry('hanim',{lid:[0.28,0.36],lidTilt:-0.1,look:[-0.6,0.1],browUp:[0.07,0.0],browTilt:[-0.03,0.02],mouth:'smirkL',mouthX:-0.03,arms:['hip','wave']});
for(const [o,xp,ry] of [[bey,-1.25,0.32],[han,1.25,-0.32]]){o.position.set(xp,-o.userData.feetY,0); o.rotation.y=ry; scene.add(o);}
floor.position.y=0;
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100); cam.position.set(0,1.0,6.6); cam.lookAt(0,0.95,0);
r.render(scene,cam); window.DONE=true;
</script></body></html>
